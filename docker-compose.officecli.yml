# Opt-in OfficeCLI companion service.
#
# Usage:
#   OFFICECLI_API_TOKEN=<strong-random-token> docker compose \
#     -f docker-compose.yml -f docker-compose.officecli.yml up -d --build
services:
  connector:
    depends_on:
      officecli-api:
        condition: service_healthy
    environment:
      OOMOL_CONNECT_ALLOW_PRIVATE_NETWORK: "true"

  officecli-api:
    image: open-connector-officecli-api:${OFFICECLI_API_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: services/officecli-api/Dockerfile
      args:
        OFFICECLI_VERSION: ${OFFICECLI_VERSION:-1.0.123}
    init: true
    ports:
      - "${OFFICECLI_API_BIND_ADDRESS:-127.0.0.1}:${OFFICECLI_API_PORT:-3030}:3030"
    volumes:
      - officecli-documents:/documents
    environment:
      OFFICECLI_API_TOKEN: ${OFFICECLI_API_TOKEN}
      OFFICECLI_MAX_CONCURRENT: ${OFFICECLI_MAX_CONCURRENT:-2}
      OFFICECLI_MAX_REQUEST_BYTES: ${OFFICECLI_MAX_REQUEST_BYTES:-104857600}
      OFFICECLI_COMMAND_TIMEOUT_MS: ${OFFICECLI_COMMAND_TIMEOUT_MS:-180000}
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3030/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  officecli-documents:
